<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Social share image source</title>
<style>
/* Renders to assets/og-image.png at 1200x630. */
@font-face{font-family:"Schibsted Grotesk";font-weight:400 800;src:url(../assets/fonts/schibsted-grotesk-var-latin.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;background:#161412;color:#F2EBDD;font-family:"Schibsted Grotesk",system-ui,sans-serif;overflow:hidden}
.c{width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.k{font-size:26px;font-weight:700;color:#B2BC7C}
h1{margin:20px 0 0;max-width:1000px;font-size:80px;line-height:1.05;letter-spacing:-.025em;font-weight:800}
h1 em{font-style:normal;color:#B2BC7C}
.row{display:flex;gap:56px}
.t b{display:block;font-size:56px;line-height:1;letter-spacing:-.03em;font-weight:800;color:#B2BC7C}
.t span{display:block;margin-top:8px;font-size:22px;color:#CFC6B6}
.n{margin-top:34px;padding-top:24px;border-top:1px solid rgba(241,232,216,.2);display:flex;justify-content:space-between;font-size:28px;font-weight:700}
.n span{font-weight:400;color:#A39988;font-size:24px}
</style>
</head>
<body>
<div class="c">
  <div>
    <div class="k">Senior marketing operations &amp; automation</div>
    <h1>Marketing operations that turn <em>14 million</em> contacts into pipeline.</h1>
  </div>
  <div>
    <div class="row">
      <div class="t"><b>+15%</b><span>MQL-to-SQL</span></div>
      <div class="t"><b>~15%</b><span>more upgrades</span></div>
      <div class="t"><b>+10%</b><span>deliverability</span></div>
    </div>
    <div class="n">Harrison Holt <span>Dallas, TX</span></div>
  </div>
</div>
</body>
</html>
