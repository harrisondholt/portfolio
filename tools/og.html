<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Social share image source</title>
<style>
/* Renders to assets/og-image.png at 1200x630. */
@font-face{font-family:"Schibsted Grotesk";font-weight:400 800;src:url(../assets/fonts/schibsted-grotesk-var-latin.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(../assets/fonts/ibm-plex-mono-500-latin.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;background:#0D1411;color:#EAEDE4;font-family:"Schibsted Grotesk",system-ui,sans-serif;overflow:hidden}
.c{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;
  background-image:linear-gradient(rgba(206,224,200,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(206,224,200,.09) 1px,transparent 1px);background-size:48px 48px}
.k{font:500 22px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#8FB88A}
h1{margin:22px 0 0;max-width:980px;font-size:76px;line-height:1.04;letter-spacing:-.025em;font-weight:800}
h1 em{font-style:normal;color:#8FB88A}
.row{display:flex;gap:2px;background:rgba(206,224,200,.22);border:1px solid rgba(206,224,200,.22);border-radius:8px;overflow:hidden}
.t{flex:1;padding:22px 26px;background:#131C18}
.t b{display:block;font-size:54px;line-height:1;letter-spacing:-.03em;font-weight:800}
.t span{display:block;margin-top:10px;font:500 18px/1.3 "IBM Plex Mono",monospace;color:#93A08E}
.n{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;font-size:26px;font-weight:700}
.n span{font:500 20px "IBM Plex Mono",monospace;color:#BAC4B4;font-weight:500}
</style>
</head>
<body>
<div class="c">
  <div>
    <div class="k">Senior marketing operations &amp; automation</div>
    <h1>Marketing operations that turn <em>14 million</em> contacts into pipeline.</h1>
  </div>
  <div>
    <div class="row">
      <div class="t"><b>14M+</b><span>contacts governed</span></div>
      <div class="t"><b>+15%</b><span>MQL-to-SQL</span></div>
      <div class="t"><b>~15%</b><span>more upgrades</span></div>
      <div class="t"><b>+10%</b><span>deliverability</span></div>
    </div>
    <div class="n">Harrison Holt <span>Dallas, TX &middot; 10 years</span></div>
  </div>
</div>
</body>
</html>
